<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Freenish Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito+Sans:wght@400;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css"></head><body><main class="wrap"><header><div><div class="logo">freenish<span>★</span></div><div class="sub">ADMIN</div></div><button id="logout" class="ghost" hidden>Log out</button></header><section id="loginPanel" class="panel"><h1>Admin login</h1><p>Private access to manage Freenish finds.</p><form id="loginForm"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button class="primary">Log in</button><p id="loginMsg" class="msg"></p></form></section><section id="adminPanel" hidden><div class="panel"><h1 id="formTitle">Add a find</h1><form id="listingForm"><input id="editingId" type="hidden"><label>Furniture name<input id="title" required placeholder="e.g. Solid Oak Bed Frame"></label><div class="grid"><label>Category<select id="category" required><option value="">Choose category</option><option>Sofas</option><option>Chairs</option><option>Beds</option><option>Storage</option><option>Tables</option><option>TV Units</option><option>Lighting</option><option>Desks</option><option>Outdoor</option><option>Other</option></select></label><label>Style<select id="style"><option>Vintage</option><option>Mid-Century</option><option>Modern</option><option>Rustic</option><option>Scandinavian</option><option>Industrial</option><option>Country</option><option>Traditional</option><option>Contemporary</option><option>Other</option></select></label><label>Material<select id="material"><option>Solid Oak</option><option>Pine</option><option>Teak</option><option>Wood</option><option>MDF</option><option>Metal</option><option>Rattan</option><option>Glass</option><option>Upholstered</option><option>Other</option></select></label><label>Color<select id="color"><option>Natural/Wood</option><option>White</option><option>Black</option><option>Grey</option><option>Green</option><option>Blue</option><option>Yellow</option><option>Orange</option><option>Red</option><option>Pink</option><option>Purple</option><option>Multi</option><option>Other</option></select></label><label>Location<select id="location"><option>Newport</option><option>Cardiff</option><option>Cwmbran</option><option>Pontypool</option><option>Caerleon</option><option>Abergavenny</option><option>Other</option></select></label><label>Distance (miles)<input id="distance" type="number" min="0" step="0.1" value="0"></label><label>Source<select id="source"><option>Gumtree</option><option>Facebook Marketplace</option><option>Freecycle</option><option>Freegle</option><option>Other</option></select></label><label>Duration<select id="duration"><option value="7">7 days</option><option value="14" selected>14 days</option><option value="21">21 days</option><option value="30">30 days</option></select></label></div><label>Original listing URL<input id="url" type="url" required placeholder="https://..."></label><label class="check"><input id="pick" type="checkbox"> ★ Freenish Pick</label><div class="actions"><button class="primary">Save find</button><button id="cancelEdit" class="ghost" type="button" hidden>Cancel edit</button></div><p id="formMsg" class="msg"></p></form></div><div class="panel"><h2>Active finds</h2><div id="listings">Loading…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin-config.js"></script><script src="admin.js"></script></body></html>
